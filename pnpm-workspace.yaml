packages:
  - apps/*
  - packages/*
  - examples/*
versioning:
  ignore:
    - weapp.dev
    - '@weapp-io/web'
    - '@weapp-io/open-source'
    - '@weapp-io/project-catalog'
    - '@weapp-io/site-ui'
  changelog:
    storage: repository
allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  workerd: true
overrides:
  # Remove when oxfmt no longer pins the vulnerable tinypool 2.1.0.
  tinypool@2.1.0: 2.1.2
patchedDependencies:
  # Remove after upstream includes Astro templates in source scanning and HMR.
  '@weapp-tailwindcss/source-scan@0.1.2': patches/@weapp-tailwindcss__source-scan@0.1.2.patch
minimumReleaseAgeExclude:
  - '@icebreakers/commitlint-config@4.1.4'
  - '@icebreakers/eslint-config@8.0.11'
  - '@icebreakers/monorepo-templates@3.0.1'
  - '@icebreakers/monorepo@6.0.1'
  - '@icebreakers/stylelint-config@5.1.5'
  - postcss-tailwindcss@3.1.5
  - repoctl@6.0.1
  - stylelint-plugin-tailwindcss@3.1.5
