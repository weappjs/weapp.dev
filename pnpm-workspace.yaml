packages:
  - apps/*
  - packages/*
  - examples/*
versioning:
  ignore:
    - weapp.dev
    - '@weapp-io/web'
    - '@weapp-io/open-source'
    - '@weapp-io/project-catalog'
    - '@weapp-io/site-ui'
  changelog:
    storage: repository
allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  workerd: true
overrides:
  # Remove when oxfmt no longer pins the vulnerable tinypool 2.1.0.
  tinypool@2.1.0: 2.1.2
patchedDependencies:
  # Remove when upstream retries branch conflicts after verifying the target state is unchanged.
  '@icebreakers/monorepo@6.2.1': patches/@icebreakers__monorepo@6.2.1.patch
  # Remove after upstream includes Astro templates in source scanning and HMR.
  '@weapp-tailwindcss/source-scan@0.1.2': patches/@weapp-tailwindcss__source-scan@0.1.2.patch

# Dependency updates are admitted immediately under the reviewed repository policy.
minimumReleaseAge: 0
