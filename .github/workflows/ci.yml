name: Commercial CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'patches/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - '*.config.*'
      - tsconfig.json
      - .node-version
      - .github/workflows/ci.yml
      - .github/workflows/repoctl-docs.yml
      - .github/workflows/repoctl-docs-deploy.yml
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'patches/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - '*.config.*'
      - tsconfig.json
      - .node-version
      - .github/workflows/ci.yml
      - .github/workflows/repoctl-docs.yml
      - .github/workflows/repoctl-docs-deploy.yml
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: '0'

permissions:
  contents: read

jobs:
  verify:
    name: Verify commercial application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO_DOCS_CHANNEL: ${{ github.event_name == 'pull_request' && 'preview' || 'stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check dependency boundaries
        run: pnpm check:boundaries
      - name: Check shared catalog
        run: pnpm --filter @weapp-io/project-catalog check && pnpm --filter @weapp-io/project-catalog lint && pnpm --filter @weapp-io/project-catalog test
      - name: Check shared UI
        run: pnpm --filter @weapp-io/site-ui lint && pnpm --filter @weapp-io/site-ui lint:styles && pnpm --filter @weapp-io/site-ui check && pnpm --filter @weapp-io/site-ui test
      - name: Check application
        run: pnpm --filter @weapp-io/web lint && pnpm --filter @weapp-io/web lint:styles && pnpm --filter @weapp-io/web check && pnpm --filter @weapp-io/web test
      - name: Build and validate
        run: pnpm --filter @weapp-io/web build
      - name: Bind the preview artifact to this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/docs-build.mjs web --identity-only
      - name: Install browser
        run: pnpm --filter @weapp-io/web exec playwright install --with-deps chromium
      - name: Test deployment artifact
        run: pnpm --filter @weapp-io/web exec playwright test
      - name: Retain validated artifact for deployment and rollback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-results
          path: apps/web/test-results
          retention-days: 7

  deploy-preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pr-preview-web-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PR_NUMBER: ${{ github.event.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy the tested PR artifact
        id: preview
        run: node scripts/docs-deployment/cli.mjs pr web
      - name: Update the preview comment
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- weapp-web-preview -->'
            const body = `${marker}\n\nweb preview: ${process.env.PREVIEW_URL}\n\nCommit: ${process.env.PR_HEAD_SHA}`
            const issue_number = Number(process.env.PR_NUMBER)
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number })
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body })
            }
      - name: Retain preview deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-web-deployment-${{ github.event.number }}
          path: .cache/docs-deployment
          if-no-files-found: ignore
          retention-days: 7
