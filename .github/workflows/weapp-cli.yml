name: weapp CLI

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/weapp/**'
      - 'packages/project-catalog/**'
      - 'packages/site-ui/**'
      - 'patches/**'
      - 'scripts/check-boundaries*'
      - scripts/release-versioning.test.mjs
      - '.changeset/**'
      - repoctl.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - eslint.config.js
      - .github/workflows/weapp-cli.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - 'packages/weapp/**'
      - 'packages/project-catalog/**'
      - 'packages/site-ui/**'
      - 'patches/**'
      - 'scripts/check-boundaries*'
      - scripts/release-versioning.test.mjs
      - '.changeset/**'
      - repoctl.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - eslint.config.js
      - .github/workflows/weapp-cli.yml
      - .github/workflows/release.yml
  workflow_dispatch:

env:
  LEFTHOOK: '0'

permissions:
  contents: read

concurrency:
  group: weapp-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm --filter weapp exec tsx scripts/build.ts --check-readme
      - run: pnpm --filter weapp check && pnpm --filter weapp lint && pnpm --filter weapp lint:styles && pnpm --filter weapp test
      - run: pnpm --filter weapp exec playwright install --with-deps chromium
      - run: pnpm --filter weapp test:e2e
      - run: python3 packages/weapp/scripts/pty-test.py
      - run: pnpm --filter weapp test:pack
      - name: Pack validated artifact
        working-directory: packages/weapp
        run: |
          mkdir -p ../../.cache/weapp-artifact
          npm pack --ignore-scripts --pack-destination ../../.cache/weapp-artifact
          cp .cache/validation/artifact-smoke.mjs ../../.cache/weapp-artifact/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: weapp-tarball
          path: .cache/weapp-artifact/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: weapp-visual-evidence
          path: packages/weapp/.cache/qa/
          if-no-files-found: ignore

  artifact:
    needs: verify
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, node: 18.20.8}
          - {os: ubuntu-24.04, node: 22.23.4}
          - {os: windows-latest, node: 18.20.8}
          - {os: windows-latest, node: 24.22.1}
          - {os: macos-latest, node: 24.22.1}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weapp-tarball
          path: artifact
      - name: Install and exercise the real tarball
        shell: bash
        run: |
          cd artifact
          npm install --ignore-scripts --omit=dev --no-audit --no-fund ./weapp-*.tgz
          node artifact-smoke.mjs node_modules/weapp
