name: Recover the verified 0.4.0 Pages artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-open-source-stable
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.repository == 'weappjs/weapp.dev' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: docs-open-source-stable
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    env:
      LEFTHOOK: '0'
      REPO_DOCS_CONCURRENCY_GROUP: docs-open-source-stable
    steps:
      - name: Checkout recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the frozen release adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0b26eea7da1b67f66d31b639e5bd11087b5295d6
          path: .recovery/source
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .recovery/source/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install frozen adapter dependencies without build scripts
        working-directory: .recovery/source
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recover only the verified original tarball
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { spawnSync } = require('node:child_process')
            const result = spawnSync('node', ['scripts/recover-pages-0.4.0.mjs'], {
              stdio: 'inherit', env: process.env,
            })
            if (result.error || result.status !== 0) throw new Error('Pages artifact recovery stopped; inspect sanitized diagnostics.')
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/pages-recovery
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
