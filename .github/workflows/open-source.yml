name: Open source CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/open-source/**'
      - 'packages/**'
      - 'scripts/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - '*.config.*'
      - tsconfig.json
      - .node-version
      - .github/workflows/open-source.yml
  push:
    branches: [main]
    paths:
      - 'apps/open-source/**'
      - 'packages/**'
      - 'scripts/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - '*.config.*'
      - tsconfig.json
      - .node-version
      - .github/workflows/open-source.yml
  workflow_dispatch:

concurrency:
  group: open-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify open-source application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check dependency boundaries
        run: pnpm check:boundaries
      - name: Check shared catalog
        run: pnpm --filter @weapp/project-catalog check && pnpm --filter @weapp/project-catalog lint && pnpm --filter @weapp/project-catalog test
      - name: Check shared UI
        run: pnpm --filter @weapp/site-ui lint && pnpm --filter @weapp/site-ui lint:styles && pnpm --filter @weapp/site-ui check && pnpm --filter @weapp/site-ui test
      - name: Check application
        run: pnpm --filter @weapp/open-source lint && pnpm --filter @weapp/open-source lint:styles && pnpm --filter @weapp/open-source check && pnpm --filter @weapp/open-source test
      - name: Build and validate
        run: pnpm --filter @weapp/open-source build
      - name: Install browser
        run: pnpm --filter @weapp/open-source exec playwright install --with-deps chromium
      - name: Test deployment artifact
        run: pnpm --filter @weapp/open-source exec playwright test
      - name: Retain validated artifact for deployment and rollback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-source-dist
          path: apps/open-source/dist
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-source-test-results
          path: apps/open-source/test-results
          retention-days: 7

  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download the GitHub Pages site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: open-source-dist
          path: dist

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: false

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
