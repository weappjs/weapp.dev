name: Open source CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/open-source/**'
      - 'packages/**'
      - 'scripts/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - '*.config.*'
      - tsconfig.json
      - .node-version
      - .github/workflows/open-source.yml
  push:
    branches: [main]
    paths:
      - 'apps/open-source/**'
      - 'packages/**'
      - 'scripts/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - '*.config.*'
      - tsconfig.json
      - .node-version
      - .github/workflows/open-source.yml
  workflow_dispatch:

concurrency:
  group: open-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify open-source application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check dependency boundaries
        run: pnpm check:boundaries
      - name: Check shared catalog
        run: pnpm --filter @weapp/project-catalog check && pnpm --filter @weapp/project-catalog lint && pnpm --filter @weapp/project-catalog test
      - name: Check shared UI
        run: pnpm --filter @weapp/site-ui lint && pnpm --filter @weapp/site-ui lint:styles && pnpm --filter @weapp/site-ui check && pnpm --filter @weapp/site-ui test
      - name: Check application
        run: pnpm --filter @weapp/open-source lint && pnpm --filter @weapp/open-source lint:styles && pnpm --filter @weapp/open-source check && pnpm --filter @weapp/open-source test
      - name: Build and validate
        run: pnpm --filter @weapp/open-source build
      - name: Install browser
        run: pnpm --filter @weapp/open-source exec playwright install --with-deps chromium
      - name: Test deployment artifact
        run: pnpm --filter @weapp/open-source exec playwright test
      - name: Retain validated artifact for deployment and rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-source-dist
          path: apps/open-source/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-source-test-results
          path: apps/open-source/test-results
          retention-days: 7

  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download the GitHub Pages site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: open-source-dist
          path: dist

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
