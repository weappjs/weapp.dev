name: Publish weapp package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-weapp
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'weappjs/weapp.dev'
    name: Publish weapp to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the package
        run: pnpm --filter weapp test

      - name: Verify the package contents
        working-directory: packages/weapp
        run: npm pack --dry-run --json

      - name: Publish with npm provenance
        working-directory: packages/weapp
        run: npm publish --access public --provenance
