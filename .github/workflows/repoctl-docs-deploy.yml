# repoctl-managed: docs-deploy/v1
name: Deploy documentation

on:
  workflow_call:
    inputs:
      site:
        required: true
        type: string
      channel:
        required: true
        type: string
      source-sha:
        required: false
        default: ''
        type: string
      release:
        required: false
        default: ''
        type: string
      commits:
        required: false
        default: ''
        type: string

env:
  LEFTHOOK: '0'

permissions:
  contents: read

concurrency:
  group: docs-${{ inputs.site }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  cloudflare:
    if: ${{ github.repository == 'weappjs/weapp.dev' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && (inputs.site == 'web' || inputs.channel == 'preview') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: docs-${{ inputs.site }}-${{ inputs.channel }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the validation browser
        run: pnpm --filter @weapp-io/web exec playwright install --with-deps chromium
      - name: Plan and deploy the selected documentation source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DOCS_SITE: ${{ inputs.site }}
          REPO_DOCS_CHANNEL: ${{ inputs.channel }}
          REPO_DOCS_SOURCE_SHA: ${{ inputs.source-sha }}
          REPO_DOCS_RELEASE: ${{ inputs.release }}
          REPO_DOCS_COMMITS: ${{ inputs.commits }}
          REPO_DOCS_CONCURRENCY_GROUP: docs-${{ inputs.site }}-${{ inputs.channel }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=("$REPO_DOCS_SITE" --channel "$REPO_DOCS_CHANNEL")
          if [ -n "$REPO_DOCS_SOURCE_SHA" ]; then args+=(--source-sha "$REPO_DOCS_SOURCE_SHA"); fi
          if [ -n "$REPO_DOCS_RELEASE" ]; then args+=(--release "$REPO_DOCS_RELEASE"); fi
          if [ -n "$REPO_DOCS_COMMITS" ]; then
            read -r -a commits <<< "$REPO_DOCS_COMMITS"
            args+=(--commits "${commits[@]}")
          fi
          pnpm exec repo docs plan "${args[@]}" --json
          pnpm exec repo docs deploy "${args[@]}" --json
      - name: Retain the tested deployment artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ inputs.site }}-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/docs-artifacts/${{ inputs.site }}/${{ inputs.channel }}/dist
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain deployment and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-evidence-${{ inputs.site }}-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/docs-artifacts/${{ inputs.site }}/${{ inputs.channel }}/test-results
            .cache/docs-deployment
          if-no-files-found: ignore
          retention-days: 7

  pages:
    if: ${{ github.repository == 'weappjs/weapp.dev' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && inputs.site == 'open-source' && inputs.channel == 'stable' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: docs-${{ inputs.site }}-${{ inputs.channel }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the validation browser
        run: pnpm --filter @weapp-io/web exec playwright install --with-deps chromium
      # A JavaScript action exposes the runner artifact service credentials to its child.
      - name: Plan and deploy the validated Pages artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DOCS_SITE: ${{ inputs.site }}
          REPO_DOCS_CHANNEL: ${{ inputs.channel }}
          REPO_DOCS_SOURCE_SHA: ${{ inputs.source-sha }}
          REPO_DOCS_RELEASE: ${{ inputs.release }}
          REPO_DOCS_COMMITS: ${{ inputs.commits }}
          REPO_DOCS_CONCURRENCY_GROUP: docs-${{ inputs.site }}-${{ inputs.channel }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { spawnSync } = require('node:child_process')
            const args = [process.env.REPO_DOCS_SITE, '--channel', process.env.REPO_DOCS_CHANNEL]
            if (process.env.REPO_DOCS_SOURCE_SHA) args.push('--source-sha', process.env.REPO_DOCS_SOURCE_SHA)
            if (process.env.REPO_DOCS_RELEASE) args.push('--release', process.env.REPO_DOCS_RELEASE)
            if (process.env.REPO_DOCS_COMMITS) args.push('--commits', ...process.env.REPO_DOCS_COMMITS.trim().split(/\s+/))
            for (const command of ['plan', 'deploy']) {
              const result = spawnSync('pnpm', ['exec', 'repo', 'docs', command, ...args, '--json'], {
                stdio: 'inherit',
                env: process.env,
              })
              if (result.error || result.status !== 0) {
                throw new Error(`repo docs ${command} failed with status ${result.status}`)
              }
            }
      - name: Retain the tested deployment artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ inputs.site }}-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/docs-artifacts/${{ inputs.site }}/${{ inputs.channel }}/dist
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain deployment and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-evidence-${{ inputs.site }}-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/docs-artifacts/${{ inputs.site }}/${{ inputs.channel }}/test-results
            .cache/docs-deployment
          if-no-files-found: ignore
          retention-days: 7
