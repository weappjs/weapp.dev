name: Version Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0 # repoctl runs release:verify; package checks also run on the generated PR.

concurrency:
  group: version-packages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'weappjs/weapp.dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out the release line
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the versioning configuration
        run: pnpm exec repo config validate && pnpm change check

      - name: Prepare the version pull request with repoctl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:prepare

      - name: Validate the version pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Dispatch checks explicitly for PRs created with the workflow token.
          pr_url=$(gh pr list --head release/pnpm-version --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$pr_url" ]; then
            printf 'Version PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
            gh workflow run weapp-cli.yml --ref release/pnpm-version
            gh workflow run publish-weapp.yml --ref release/pnpm-version -f mode=preflight -f tag=release/pnpm-version
          fi
