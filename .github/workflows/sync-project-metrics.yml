name: Sync project metrics

on:
  schedule:
    - cron: '0 1 * * 1' # Monday 09:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

concurrency:
  group: sync-project-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'weappjs/weapp.dev' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh project metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm metrics:sync

      - name: Verify the metrics contract
        run: pnpm --filter @weapp-io/project-catalog test

      - name: Upload the refreshed fallback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-metrics-fallback
          path: packages/project-catalog/src/data/project-metrics.fallback.json
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: refresh
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download the refreshed fallback
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: project-metrics-fallback
          path: packages/project-catalog/src/data

      - name: Create or update the metrics pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync project metrics'
          branch: automation/sync-project-metrics
          delete-branch: true
          base: main
          title: 'chore: sync project metrics'
          body: |
            Automated weekly refresh of the committed project metrics fallback.

            Updated from the public GitHub and npm APIs:
            - latest package version and release date
            - weekly npm downloads
            - GitHub stars

            The workflow preserves the previous snapshot when public values are unchanged and updates this pull request instead of writing directly to `main`.
          add-paths: |
            packages/project-catalog/src/data/project-metrics.fallback.json
