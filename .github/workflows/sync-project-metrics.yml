name: Sync project metrics

on:
  schedule:
    - cron: '0 1 * * 1' # Monday 09:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

concurrency:
  group: sync-project-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'weappjs/weapp.dev' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh project metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm metrics:sync

      - name: Verify the metrics contract
        run: pnpm --filter @weapp/project-catalog test

      - name: Upload the refreshed fallback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-metrics-fallback
          path: packages/project-catalog/src/data/project-metrics.fallback.json
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: refresh
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Download the refreshed fallback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: project-metrics-fallback
          path: packages/project-catalog/src/data

      - name: Create or update the metrics pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync project metrics'
          branch: automation/sync-project-metrics
          delete-branch: true
          base: main
          title: 'chore: sync project metrics'
          body: |
            Automated weekly refresh of the committed project metrics fallback.

            Updated from the public GitHub and npm APIs:
            - latest package version and release date
            - weekly npm downloads
            - GitHub stars

            The workflow preserves the previous snapshot when public values are unchanged and updates this pull request instead of writing directly to `main`.
          add-paths: |
            packages/project-catalog/src/data/project-metrics.fallback.json
